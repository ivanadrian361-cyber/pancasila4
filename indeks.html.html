                                                    )}
                                                </div>

                                                <p className="text-sm font-medium text-slate-800 leading-relaxed">
                                                    {q.question}
                                                </p>

                                                {/* Options */}
                                                <div className="space-y-2 pt-2">
                                                    {q.options.map((opt) => {
                                                        const isChosen = selected === opt.key;
                                                        let optionStyle = "border-slate-200 hover:border-indigo-300 bg-white text-slate-700";

                                                        if (isChosen) {
                                                            optionStyle = "border-indigo-600 bg-indigo-50/80 text-indigo-900 font-semibold ring-1 ring-indigo-600";
                                                        }

                                                        if (quizCompleted) {
                                                            if (opt.key === q.correctAnswer) {
                                                                optionStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                                                            } else if (isChosen && !isCorrect) {
                                                                optionStyle = "border-red-400 bg-red-50 text-red-900";
                                                            }
                                                        }

                                                        return (
                                                            <button
                                                                key={opt.key}
                                                                disabled={quizCompleted}
                                                                onClick={() => handleSelectAnswer(q.id, opt.key)}
                                                                className={`w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm transition flex items-start space-x-3 ${optionStyle}`}
                                                            >
                                                                <span className="font-bold px-2 py-0.5 rounded bg-slate-100 border text-slate-700 text-xs">
                                                                    {opt.key}
                                                                </span>
                                                                <span className="flex-1 leading-snug">{opt.text}</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>

                                                {/* Pembahasan Soal jika Quiz telah di-submit */}
                                                {quizCompleted && (
                                                    <div className="mt-3 p-4 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900 space-y-1">
                                                        <strong className="font-bold block">📘 Pembahasan & Landasan Sila:</strong>
                                                        <p className="leading-relaxed">{q.explanation}</p>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Floating Submit Action */}
                                <div className="bg-white border border-slate-200 rounded-2xl p-4 sticky bottom-4 shadow-xl flex items-center justify-between">
                                    {!quizCompleted ? (
                                        <>
                                            <p className="text-xs text-slate-500">Pastikan menjawab seluruh soal sebelum mengirim jawaban.</p>
                                            <button 
                                                onClick={handleSubmitQuiz}
                                                className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition text-sm flex items-center space-x-2"
                                            >
                                                <span>Kirim Jawaban Siswa</span>
                                                <span>🚀</span>
                                            </button>
                                        </>
                                    ) : (
                                        <>
                                            <div>
                                                <span className="text-xs text-slate-500 block">Kuis Telah Selesai Ditinjau</span>
                                                <span className="text-sm font-bold text-slate-900">Skor Akhir: {lastScore} / 100</span>
                                            </div>
                                            <button 
                                                onClick={handleResetQuiz}
                                                className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition"
                                            >
                                                Ulangi Kuis
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: DASHBOARD SISWA */}
                        {activeTab === 'dashboard_siswa' && (
                            <div className="space-y-6">
                                {/* Welcome Card */}
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col md:flex-row items-center justify-between gap-6 shadow-sm">
                                    <div className="flex items-center space-x-4">
                                        <div className="w-16 h-16 rounded-2xl bg-indigo-100 border border-indigo-200 flex items-center justify-center text-3xl">
                                            👨‍🎓
                                        </div>
                                        <div>
                                            <h2 className="text-2xl font-bold text-slate-900">{user.name}</h2>
                                            <p className="text-xs font-semibold text-indigo-600">Kelas: {user.kelas}</p>
                                            <p className="text-xs text-slate-500 mt-1">Status: Terdaftar dalam Evaluasi Pancasila</p>
                                        </div>
                                    </div>

                                    <div className="flex items-center space-x-3 w-full md:w-auto">
                                        <button 
                                            onClick={() => setActiveTab('latihan')}
                                            className="w-full md:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow transition"
                                        >
                                            {myHistory.length > 0 ? 'Kerjakan Kuis Lagi' : 'Mulai Kuis Pertama'}
                                        </button>
                                    </div>
                                </div>

                                {/* Ringkasan Performa Siswa */}
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Total Percobaan</span>
                                        <span className="text-3xl font-black text-slate-900 mt-1 block">{myHistory.length} kali</span>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Skor Tertinggi</span>
                                        <span className="text-3xl font-black text-emerald-600 mt-1 block">
                                            {myHistory.length > 0 ? Math.max(...myHistory.map(h => h.score)) : '-'}
                                        </span>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Predikat Capaian</span>
                                        <span className="text-lg font-extrabold text-indigo-700 mt-2 block">
                                            {myHistory.length > 0 ? (
                                                Math.max(...myHistory.map(h => h.score)) >= 85 ? 'Sangat Baik (A)' :
                                                Math.max(...myHistory.map(h => h.score)) >= 75 ? 'Baik (B)' : 'Perlu Bimbingan'
                                            ) : 'Belum Ada Data'}
                                        </span>
                                    </div>
                                </div>

                                {/* Tabel Riwayat Pengerjaan */}
                                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                    <div className="p-5 border-b border-slate-100">
                                        <h3 className="font-bold text-slate-900">Riwayat Hasil Kuis Anda</h3>
                                    </div>
                                    {myHistory.length === 0 ? (
                                        <div className="p-8 text-center text-slate-500 text-xs">
                                            Belum ada riwayat kuis tersimpan. Silakan klik menu "Latihan Soal" untuk memulai!
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs">
                                                <thead className="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-200">
                                                    <tr>
                                                        <th className="p-4">Tanggal & Waktu</th>
                                                        <th className="p-4">Kelas</th>
                                                        <th className="p-4">Jawaban Benar</th>
                                                        <th className="p-4">Nilai Skor</th>
                                                        <th className="p-4">Status</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {myHistory.map((item) => (
                                                        <tr key={item.id} className="hover:bg-slate-50 transition">
                                                            <td className="p-4 text-slate-600 font-medium">
                                                                {new Date(item.timestamp).toLocaleString('id-ID')}
                                                            </td>
                                                            <td className="p-4 text-slate-800 font-bold">{item.kelas}</td>
                                                            <td className="p-4 text-slate-700">{item.correctCount || Math.round((item.score/100)*10)} / 10</td>
                                                            <td className="p-4">
                                                                <span className={`px-2.5 py-1 rounded-lg font-bold text-xs ${item.score >= 75 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                                    {item.score}
                                                                </span>
                                                            </td>
                                                            <td className="p-4">
                                                                {item.score >= 75 ? (
                                                                    <span className="text-emerald-600 font-bold">Tuntas</span>
                                                                ) : (
                                                                    <span className="text-amber-600 font-bold">Remedial</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: DASHBOARD GURU */}
                        {activeTab === 'dashboard_guru' && (
                            <div className="space-y-6">
                                {/* Header Dashboard Guru & Kelas Filter */}
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-sm">
                                    <div>
                                        <div className="flex items-center space-x-2">
                                            <span className="px-2.5 py-0.5 bg-slate-900 text-white rounded text-xs font-bold uppercase">Mode Pendidik</span>
                                            <h2 className="text-2xl font-extrabold text-slate-900">Dashboard Hasil Siswa</h2>
                                        </div>
                                        <p className="text-xs text-slate-500 mt-1">Pantau perkembangan pemahaman analisis Pancasila siswa berdasarkan kelas.</p>
                                    </div>

                                    {/* Class Filter Selection */}
                                    <div className="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                        <label className="text-xs font-bold text-slate-700 whitespace-nowrap">Filter Kelas:</label>
                                        <select 
                                            value={selectedClassFilter}
                                            onChange={(e) => setSelectedClassFilter(e.target.value)}
                                            className="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-slate-900"
                                        >
                                            {uniqueClasses.map(cls => (
                                                <option key={cls} value={cls}>
                                                    {cls === 'ALL' ? '📌 Semua Kelas' : `Kelas: ${cls}`}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* Analisis Statistik Kelas */}
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Total Responden</span>
                                        <span className="text-3xl font-black text-slate-900 mt-1 block">{teacherStats.total} Siswa</span>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Rata-Rata Nilai</span>
                                        <span className="text-3xl font-black text-indigo-600 mt-1 block">{teacherStats.avgScore}</span>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Tingkat Ketuntasan</span>
                                        <span className="text-3xl font-black text-emerald-600 mt-1 block">{teacherStats.passRate}%</span>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Nilai Tertinggi</span>
                                        <span className="text-3xl font-black text-amber-500 mt-1 block">{teacherStats.highest}</span>
                                    </div>
                                </div>

                                {/* Tabel Rekap Jawaban Siswa per Kelas */}
                                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                    <div className="p-5 border-b border-slate-100 flex items-center justify-between">
                                        <h3 className="font-bold text-slate-900">
                                            Rekapitulasi Hasil Jawaban {selectedClassFilter !== 'ALL' ? `(${selectedClassFilter})` : 'Seluruh Kelas'}
                                        </h3>
                                        <span className="text-xs text-slate-400">{filteredSubmissions.length} Data ditemukan</span>
                                    </div>

                                    {filteredSubmissions.length === 0 ? (
                                        <div className="p-8 text-center text-slate-500 text-xs">
                                            Belum ada data pengerjaan siswa untuk kelas ini.
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs">
                                                <thead className="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-200">
                                                    <tr>
                                                        <th className="p-4">Nama Siswa</th>
                                                        <th className="p-4">Kelas</th>
                                                        <th className="p-4">Waktu Selesai</th>
                                                        <th className="p-4">Skor</th>
                                                        <th className="p-4">Aksi / Detail</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredSubmissions.map((sub) => (
                                                        <tr key={sub.id} className="hover:bg-slate-50 transition">
                                                            <td className="p-4 font-bold text-slate-800">{sub.name}</td>
                                                            <td className="p-4 font-semibold text-indigo-600">
                                                                <span className="px-2 py-0.5 rounded bg-indigo-50 border border-indigo-100">
                                                                    {sub.kelas}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 text-slate-500">
                                                                {new Date(sub.timestamp).toLocaleString('id-ID')}
                                                            </td>
                                                            <td className="p-4">
                                                                <span className={`px-2.5 py-1 rounded-lg font-bold text-xs ${sub.score >= 75 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                                                    {sub.score} / 100
                                                                </span>
                                                            </td>
                                                            <td className="p-4 flex items-center space-x-2">
                                                                <button 
                                                                    onClick={() => setSelectedStudentDetail(sub)}
                                                                    className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold transition"
                                                                >
                                                                    Lihat Per-Soal
                                                                </button>
                                                                <button 
                                                                    onClick={() => handleDeleteSubmission(sub.id)}
                                                                    className="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition"
                                                                    title="Hapus Data"
                                                                >
                                                                    🗑️
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Modal Detail Jawaban Siswa untuk Guru */}
                    {selectedStudentDetail && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-200">
                                <div className="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50 rounded-t-2xl">
                                    <div>
                                        <h3 className="font-bold text-slate-900 text-base">Detail Rincian Jawaban Siswa</h3>
                                        <p className="text-xs text-slate-500">{selectedStudentDetail.name} — <span className="font-semibold text-indigo-600">{selectedStudentDetail.kelas}</span></p>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedStudentDetail(null)}
                                        className="p-2 text-slate-400 hover:text-slate-800 font-bold"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto custom-scrollbar space-y-4">
                                    <div className="flex items-center justify-between p-3 bg-indigo-50 rounded-xl border border-indigo-100">
                                        <span className="text-xs font-bold text-indigo-900">Skor Total Siswa</span>
                                        <span className="text-lg font-black text-indigo-700">{selectedStudentDetail.score} / 100</span>
                                    </div>

                                    {QUESTIONS_DATA.map((q, idx) => {
                                        const ans = selectedStudentDetail.answers ? selectedStudentDetail.answers[q.id] : null;
                                        const isCorrect = ans === q.correctAnswer;

                                        return (
                                            <div key={q.id} className="p-4 rounded-xl border border-slate-200 text-xs space-y-2">
                                                <div className="flex items-center justify-between">
                                                    <span className="font-bold text-slate-800">Soal #{idx + 1} ({q.silaTitle})</span>
                                                    <span className={`px-2 py-0.5 rounded font-bold ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                                        {isCorrect ? '✓ Benar' : '✗ Salah'}
                                                    </span>
                                                </div>
                                                <p className="text-slate-600">{q.question}</p>
                                                <div className="pt-1 flex flex-wrap gap-4 text-[11px]">
                                                    <span className="text-slate-500">Jawaban Siswa: <strong className={isCorrect ? "text-emerald-600" : "text-red-600"}>{ans || 'Tidak Diisi'}</strong></span>
                                                    <span className="text-slate-500">Kunci Jawaban: <strong className="text-slate-800">{q.correctAnswer}</strong></span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="p-4 border-t border-slate-100 text-right bg-slate-50 rounded-b-2xl">
                                    <button 
                                        onClick={() => setSelectedStudentDetail(null)}
                                        className="px-4 py-2 bg-slate-900 text-white font-bold rounded-xl text-xs hover:bg-slate-800 transition"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-4 mt-auto text-center text-xs text-slate-400">
                        PancasilaEdu — Media Pembelajaran Interaktif Pendidikan Pancasila & Kewarganegaraan
                    </footer>
                </div>
            );
        }

        // Render application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
